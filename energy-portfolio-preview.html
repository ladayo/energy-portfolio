<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Security Learning Portfolio — preview</title>
<meta name="description" content="A learning journal on sustainability, energy security and fair energy transitions">
<style>
/* Energy Security Learning Portfolio — styles
   Palette: deep green, navy blue, warm white and subtle earth tones. */

:root {
  color-scheme: light dark;
  --bg: #fbf9f4;
  --surface: #ffffff;
  --tint: #f2ede3;
  --text: #1b2433;
  --muted: #535a65;
  --heading: #13294b;
  --navy: #13294b;
  --navy-2: #1d3a66;
  --green: #1d5c45;
  --green-strong: #14402f;
  --green-soft: #e3efe8;
  --earth: #8f5426;
  --earth-soft: #f4e7d8;
  --sand: #e9dcc4;
  --border: #ddd4c4;
  --link: #1d5c45;
  --link-hover: #13294b;
  --focus: #b45309;
  --error: #a3261b;
  --error-bg: #fbeceb;
  --success: #1d5c45;
  --success-bg: #e3efe8;
  --ph-bg: #fff3cd;
  --ph-text: #5c4300;
  --ph-border: #b8901a;
  --hero-from: #13294b;
  --hero-to: #14402f;
  --hero-text: #ffffff;
  --hero-muted: #e7dcc6;
  --shadow: 0 1px 2px rgba(19, 41, 75, .06), 0 6px 18px rgba(19, 41, 75, .07);
  --radius: 14px;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --max: 1180px;
  --narrow: 760px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #0d1724;
    --surface: #132134;
    --tint: #0f1c2c;
    --text: #e8edf2;
    --muted: #a9b5c2;
    --heading: #f1f5f9;
    --green-soft: #173528;
    --earth-soft: #2b2016;
    --sand: #3a3226;
    --border: #2a3b52;
    --link: #8fd6b1;
    --link-hover: #c7ecd8;
    --focus: #f5b971;
    --error: #ff9c8f;
    --error-bg: #3a1714;
    --success: #8fd6b1;
    --success-bg: #173528;
    --ph-bg: #3d3210;
    --ph-text: #ffe39a;
    --ph-border: #c9a227;
    --earth: #e2a36f;
    --hero-from: #0b1a30;
    --hero-to: #0f2e22;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --bg: #0d1724;
  --surface: #132134;
  --tint: #0f1c2c;
  --text: #e8edf2;
  --muted: #a9b5c2;
  --heading: #f1f5f9;
  --green-soft: #173528;
  --earth-soft: #2b2016;
  --sand: #3a3226;
  --border: #2a3b52;
  --link: #8fd6b1;
  --link-hover: #c7ecd8;
  --focus: #f5b971;
  --error: #ff9c8f;
  --error-bg: #3a1714;
  --success: #8fd6b1;
  --success-bg: #173528;
  --ph-bg: #3d3210;
  --ph-text: #ffe39a;
  --ph-border: #c9a227;
  --earth: #e2a36f;
  --hero-from: #0b1a30;
  --hero-to: #0f2e22;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px rgba(0, 0, 0, .25);
}

:root[data-theme="contrast"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --tint: #ffffff;
  --text: #000000;
  --muted: #1a1a1a;
  --heading: #000000;
  --navy: #000000;
  --green: #003d24;
  --green-strong: #000000;
  --green-soft: #ffffff;
  --earth: #5a2d00;
  --earth-soft: #ffffff;
  --border: #000000;
  --link: #00307a;
  --link-hover: #000000;
  --focus: #c2410c;
  --error: #8a0000;
  --success: #003d24;
  --hero-from: #000000;
  --hero-to: #000000;
  --hero-muted: #ffffff;
  --shadow: none;
}

:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* ------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; scroll-padding-top: 6rem; }
html[data-text="lg"] { font-size: 112.5%; }
html[data-text="xl"] { font-size: 125%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.65;
  text-rendering: optimizeLegibility;
}
html.pref-spacing body { line-height: 1.95; letter-spacing: .02em; word-spacing: .08em; }
html.pref-spacing p, html.pref-spacing li { margin-block-end: 1.1em; }
html.pref-underline a { text-decoration: underline !important; }

h1, h2, h3, h4 { font-family: var(--serif); color: var(--heading); line-height: 1.2; margin: 0 0 .5em; font-weight: 700; }
h1 { font-size: clamp(2rem, 4.2vw, 3rem); letter-spacing: -.01em; }
h2 { font-size: clamp(1.45rem, 2.6vw, 1.9rem); }
h3 { font-size: 1.25rem; }
h4 { font-size: 1.1rem; }
p { margin: 0 0 1em; }
a { color: var(--link); text-underline-offset: .18em; text-decoration-thickness: 1px; }
a:hover { color: var(--link-hover); text-decoration-thickness: 2px; }
img { max-width: 100%; height: auto; }
mark { background: var(--ph-bg); color: var(--ph-text); padding: 0 .15em; border-radius: 3px; }
code { font-size: .92em; background: var(--tint); padding: .1em .35em; border-radius: 4px; }
hr { border: 0; border-block-start: 1px solid var(--border); margin-block: 2rem; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
h1:focus, h2:focus, [tabindex="-1"]:focus:not(:focus-visible) { outline: none; }
#main:focus { outline: none; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; inset-inline-start: 1rem; inset-block-start: -4rem; z-index: 100;
  background: var(--navy); color: #fff; padding: .75rem 1.1rem; border-radius: 8px; font-weight: 600;
}
.skip-link:focus { inset-block-start: 1rem; color: #fff; }

.container { width: 100%; max-width: var(--max); margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); }
.container.narrow { max-width: calc(var(--narrow) + 4rem); }
.container.narrow-wide { max-width: 900px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.spaced { margin-block-start: 2.5rem; }
.loading-state { padding-block: 5rem; color: var(--muted); }

/* ------------------------------------------------------------ placeholders */
.placeholder {
  background: var(--ph-bg); color: var(--ph-text); border: 1px dashed var(--ph-border);
  border-radius: 5px; padding: 0 .35em; font-style: normal; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.placeholder-box { background: var(--ph-bg); color: var(--ph-text); border: 1px dashed var(--ph-border); border-radius: 10px; padding: 1rem 1.2rem; }
.placeholder-box .placeholder { border: 0; padding: 0; }

/* ------------------------------------------------------------ header */
.site-header {
  position: sticky; inset-block-start: 0; z-index: 50;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-block-end: 1px solid var(--border);
}
.header-inner { display: flex; align-items: center; gap: 1rem; min-height: 4.5rem; }
.brand { display: inline-flex; align-items: center; gap: .7rem; text-decoration: none; color: var(--heading); margin-inline-end: auto; }
.brand:hover { color: var(--heading); }
.brand-svg { flex: none; border-radius: 10px; }
.bm-bg { fill: var(--green-strong); }
.bm-leaf { fill: none; stroke: #cfe7d9; stroke-width: 2.2; stroke-linecap: round; }
.bm-bolt { fill: #f0c987; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-title { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; }
.brand-sub { font-size: .8rem; color: var(--muted); }
.primary-nav { order: 2; }
.primary-nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: .1rem; flex-wrap: nowrap; }
.primary-nav a {
  display: block; padding: .5rem .6rem; border-radius: 8px; color: var(--text); white-space: nowrap;
  text-decoration: none; font-weight: 500; font-size: .94rem;
}
.primary-nav a:hover { background: var(--tint); color: var(--heading); }
.primary-nav a[aria-current="page"] { color: var(--link); background: var(--green-soft); font-weight: 650; box-shadow: inset 0 -2px 0 var(--link); }
.header-tools { order: 3; display: flex; align-items: center; gap: .25rem; }
.icon-btn {
  display: inline-flex; align-items: center; gap: .4rem; min-width: 44px; min-height: 44px; justify-content: center;
  border: 1px solid transparent; background: transparent; color: var(--heading); border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600;
}
.icon-btn:hover { background: var(--tint); }
.icon-btn[aria-expanded="true"] { background: var(--green-soft); border-color: var(--border); }
.icon { width: 1.3rem; height: 1.3rem; flex: none; }
.menu-btn { display: none; padding-inline: .7rem; border-color: var(--border); }
.menu-btn .i-close { display: none; }
.menu-btn[aria-expanded="true"] .i-open { display: none; }
.menu-btn[aria-expanded="true"] .i-close { display: inline; }

.drawer { border-block-start: 1px solid var(--border); background: var(--surface); padding-block: 1rem; }
.display-panel { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: flex-start; }
.display-group { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.dp-label { width: 100%; margin: 0; font-weight: 650; font-size: .9rem; color: var(--heading); }
.dp-note { width: 100%; margin: 0; font-size: .875rem; color: var(--muted); }
.chip-btn {
  font: inherit; font-size: .9rem; min-height: 40px; padding: .35rem .85rem; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text);
}
.chip-btn:hover { border-color: var(--green); }
.chip-btn[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

@media (max-width: 1149px) {
  .menu-btn { display: inline-flex; }
  .primary-nav {
    display: none; position: absolute; inset-inline: 0; inset-block-start: 100%;
    background: var(--surface); border-block-end: 1px solid var(--border); box-shadow: var(--shadow);
    max-height: calc(100vh - 4.5rem); overflow-y: auto;
    }
  .primary-nav.open { display: block; }
  .primary-nav ul { flex-direction: column; padding: .75rem clamp(1rem, 4vw, 2rem) 1.25rem; }
  .primary-nav a { padding: .8rem .9rem; font-size: 1.05rem; }
  .primary-nav a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--link); }
}
/* Larger text sizes switch to the menu button sooner so the navigation never wraps */
@media (max-width: 1599px) {
  html[data-text] .menu-btn { display: inline-flex; }
  html[data-text] .primary-nav {
    display: none; position: absolute; inset-inline: 0; inset-block-start: 100%;
    background: var(--surface); border-block-end: 1px solid var(--border); box-shadow: var(--shadow);
    max-height: calc(100vh - 4.5rem); overflow-y: auto;
    }
  html[data-text] .primary-nav.open { display: block; }
  html[data-text] .primary-nav ul { flex-direction: column; padding: .75rem clamp(1rem, 4vw, 2rem) 1.25rem; }
  html[data-text] .primary-nav a { padding: .8rem .9rem; font-size: 1.05rem; }
  html[data-text] .primary-nav a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--link); }
}
@media (max-width: 520px) {
  .brand-sub { display: none; }
  .brand-title { font-size: .95rem; }
  .menu-label { display: none; }
  .header-inner { gap: .4rem; }
}

/* ------------------------------------------------------------ buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 46px;
  padding: .6rem 1.25rem; border-radius: 10px; border: 2px solid transparent;
  font: inherit; font-weight: 650; font-size: 1rem; text-decoration: none; cursor: pointer; line-height: 1.2;
}
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-strong); color: #fff; }
.btn-ghost { background: transparent; color: var(--heading); border-color: currentColor; }
.btn-ghost:hover { background: var(--tint); color: var(--heading); }
.btn-link { background: none; color: var(--link); text-decoration: underline; padding-inline: .4rem; }
.btn[disabled] { opacity: .65; cursor: progress; }
.btn-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-block: 1.25rem; }
:root[data-theme="dark"] .btn-primary { color: #06140e; background: #8fd6b1; }
:root[data-theme="dark"] .btn-primary:hover { background: #b6e8cc; color: #06140e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .btn-primary { color: #06140e; background: #8fd6b1; }
  :root:not([data-theme]) .btn-primary:hover { background: #b6e8cc; color: #06140e; }
}

/* ------------------------------------------------------------ hero */
.hero {
  position: relative; overflow: hidden; color: var(--hero-text);
  background:
    radial-gradient(circle at 85% 20%, rgba(240, 201, 135, .22) 0, rgba(240, 201, 135, 0) 32%),
    radial-gradient(circle at 10% 110%, rgba(143, 214, 177, .18) 0, rgba(143, 214, 177, 0) 40%),
    linear-gradient(135deg, var(--hero-from), var(--hero-to));
  padding-block: clamp(3rem, 8vw, 6rem);
}
.hero::after {
  content: ""; position: absolute; inset-inline-end: -120px; inset-block-end: -160px; width: 420px; height: 420px;
  border-radius: 50%; border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 0 0 40px rgba(255, 255, 255, .03), 0 0 0 80px rgba(255, 255, 255, .02);
  pointer-events: none;
}
.hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.35fr .85fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
.hero h1 { color: #fff; }
.hero .eyebrow { color: var(--hero-muted); }
.hero .lead p { font-size: 1.15rem; color: #f1f4f7; max-width: 38rem; }
.hero .btn-primary { background: #f0c987; color: #13294b; }
.hero .btn-primary:hover { background: #f7dcaa; color: #13294b; }
.hero .btn-ghost { color: #fff; }
.hero .btn-ghost:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.hero a:not(.btn) { color: #fff; }
.hero :focus-visible { outline-color: #f0c987; }
@media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; } .hero .portrait { max-width: 320px; } }

.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: .8rem; font-weight: 700; color: var(--earth); margin-block-end: .75rem; }

.portrait { margin: 0; }
.portrait figcaption { margin-block-start: .75rem; font-size: .9rem; color: var(--hero-muted); text-align: center; }
.portrait-img { display: block; width: 100%; aspect-ratio: 6 / 7; object-fit: cover; border-radius: 22px; box-shadow: 0 20px 40px rgba(0, 0, 0, .25); }
.portrait-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; text-align: center;
  aspect-ratio: 6 / 7; border-radius: 22px; padding: 1.5rem;
  border: 2px dashed rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .07); color: #fff;
}
.portrait-placeholder svg { width: 45%; height: auto; fill: rgba(255, 255, 255, .25); }
.pp-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 700; }
.pp-hint { font-size: .85rem; color: var(--hero-muted); max-width: 16rem; }
.portrait.small .portrait-placeholder { border-color: var(--border); background: var(--tint); color: var(--heading); }
.portrait.small .portrait-placeholder svg { fill: var(--sand); }
.portrait.small .pp-hint { color: var(--muted); }

/* ------------------------------------------------------------ sections */
.section { padding-block: clamp(2.5rem, 6vw, 4.5rem); }
.section-tint { background: var(--tint); border-block: 1px solid var(--border); }
.section-title { font-size: clamp(1.4rem, 2.4vw, 1.75rem); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-block-end: 1.25rem; }
.section-head .section-title { margin: 0; }
.more-link { font-weight: 650; text-decoration: none; }
.more-link:hover { text-decoration: underline; }

.page-header { background: var(--tint); border-block-end: 1px solid var(--border); padding-block: clamp(2.25rem, 5vw, 3.5rem); margin-block-end: 2.5rem; }
.page-header h1 { margin-block-end: .4em; }
.page-intro { font-size: 1.15rem; color: var(--muted); max-width: 46rem; margin: 0; }

.interest-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .85rem; }
.interest-list li {
  display: flex; align-items: center; gap: .75rem; padding: 1rem 1.1rem; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border); font-weight: 550;
}
.interest-list .icon { color: var(--link); }

/* ------------------------------------------------------------ cards */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.25rem; }
.card-grid.two { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (max-width: 420px) { .card-grid, .card-grid.two { grid-template-columns: 1fr; } }
.card {
  position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.4rem 1.5rem 1.25rem; box-shadow: var(--shadow); display: flex; flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--green); }
.card-eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--earth); margin-block-end: .6rem; }
.card-title { font-size: 1.25rem; margin-block-end: .4rem; }
.card-title a { color: var(--heading); text-decoration: none; }
.card-title a:hover { text-decoration: underline; }
.card-meta { font-size: .875rem; color: var(--muted); margin-block-end: .6rem; }
.card-excerpt { color: var(--text); flex: 1; }
.post-list { display: grid; gap: 1.1rem; }
.post-list .card-title { font-size: 1.4rem; }

.badge { display: inline-block; background: var(--green-soft); color: var(--link); padding: .15rem .55rem; border-radius: 999px; font-size: .75rem; letter-spacing: .04em; }
.status { display: inline-block; background: var(--earth-soft); color: var(--earth); padding: .15rem .55rem; border-radius: 999px; font-size: .75rem; letter-spacing: .04em; }

.tag-list, .tag-cloud, .topic-chips, .share-list, .social-list, .plain-list { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.plain-list { display: block; }
.plain-list li { padding-block: .35rem; border-block-end: 1px solid var(--border); }
.tag { display: inline-block; font-size: .85rem; color: var(--muted); text-decoration: none; padding: .2rem .55rem; border-radius: 6px; background: var(--tint); border: 1px solid var(--border); }
.tag:hover { color: var(--heading); border-color: var(--green); }
.topic-chips { margin-block: .9rem; }
.topic-chip { display: inline-block; font-size: .85rem; font-weight: 600; color: var(--link); background: var(--green-soft); text-decoration: none; padding: .3rem .75rem; border-radius: 999px; border: 1px solid transparent; }
a.topic-chip:hover { border-color: var(--link); color: var(--link); }
.topic-chip.static { color: var(--heading); background: var(--tint); border-color: var(--border); }
.topic-chips.small .topic-chip { font-size: .75rem; padding: .15rem .55rem; }
.topic-chips.plain { margin: 0; }

/* topics */
.topic-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.topic-grid.compact { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.topic-tile a, .topic-card a {
  display: flex; flex-direction: column; gap: .35rem; height: 100%; padding: 1.15rem 1.2rem; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: var(--text);
  transition: border-color .18s ease, transform .18s ease;
}
.topic-tile a:hover, .topic-card a:hover { border-color: var(--green); transform: translateY(-2px); }
.topic-icon { width: 2.2rem; height: 2.2rem; padding: .35rem; border-radius: 10px; background: var(--green-soft); color: var(--link); }
.topic-icon.lg { width: 3.4rem; height: 3.4rem; padding: .55rem; }
.tt-name, .tc-name { font-family: var(--serif); font-weight: 700; color: var(--heading); font-size: 1.12rem; }
.tc-desc { color: var(--muted); font-size: .95rem; flex: 1; }
.tt-count { font-size: .82rem; color: var(--earth); font-weight: 650; }
.topic-head { display: flex; gap: 1rem; align-items: center; margin-block-end: .5rem; }
.topic-head h1 { margin: 0; }
.topic-head .eyebrow { margin: 0; }

/* ------------------------------------------------------------ filters */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; padding: 1.1rem 1.25rem; margin-block-end: 1rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.filter-bar .field { margin: 0; flex: 1 1 180px; }
.filter-actions { display: flex; gap: .5rem; align-items: center; }

ng for students, lecturers, practitioners and curious readers alike.\n\n## How to take part\n\n- **Be respectful.** Disagree with ideas, never with people. Personal attacks, harassment, discrimination or hateful language will be removed.\n- **Bring evidence where you can.** Links to reports, papers or data are very welcome. Please say where a claim comes from.\n- **Stay on topic.** Comments should relate to the post they're on.\n- **Protect privacy.** Don't share personal information about yourself or anyone else.\n- **No spam or advertising.** Promotional comments and unrelated links will not be published.\n- **Be honest about who you are.** Use your real name or a consistent professional name. Affiliations are optional.\n\n## How moderation works\n\n- Every comment is reviewed before it appears. I aim to review new comments within [[number]] days.\n- I don't edit what you write. If a comment doesn't meet these guidelines, I'll decline it rather than change it.\n- Spam is filtered automatically, and submissions that look automated are discarded.\n- Your email address is used only to verify your comment and, if needed, to contact you about it. It is never published.\n\n## Removing a comment\n\nIf you'd like a comment you've posted removed, use the [contact form](#/contact) and I'll take it down.\n\n## Academic integrity\n\nPlease don't post assignment answers or confidential course material. If you quote something, credit it.\n"},"privacy":{"title":"Privacy notice","body":"This site collects as little personal information as possible.\n\n## What is collected\n\n- **Contact form:** your name, email address, optional affiliation and your message.\n- **Comments:** your name, email address (never published), optional affiliation and your comment.\n- **Email updates:** your email address, if you choose to subscribe.\n\n## How it is used\n\nInformation is used only to reply to you, to moderate and publish comments, and to send the updates you asked for. It is not sold or shared for marketing.\n\n## Where it is stored\n\nForm submissions are stored by the website host, [[name your hosting provider, e.g. Netlify]]. If you subscribe, your email address is stored by [[name your email provider]].\n\n## How long it is kept\n\n[[State how long you keep messages, comments and subscriber details — for example, \"until the end of my programme, then deleted\".]]\n\n## Your choices\n\nYou can unsubscribe at any time using the link in any email, or ask for your information to be corrected or deleted through the [contact form](#/contact).\n\n## Cookies and analytics\n\nThis site does not use advertising or tracking cookies. Display preferences (such as text size) are saved only in your own browser.\n\n*Last updated: [[date]]*\n"},"accessibility":{"title":"Accessibility statement","body":"I want this site to be usable by everyone, and I'm aiming to meet the **Web Content Accessibility Guidelines (WCAG) 2.2 at level AA**.\n\n## What's built in\n\n- A \"Skip to main content\" link and clear page landmarks for screen readers.\n- Full keyboard navigation with visible focus outlines.\n- Display options to enlarge text, switch to a dark theme or use a high-contrast theme.\n- Respect for your device's \"reduce motion\" and dark-mode settings.\n- Form fields with visible labels, clear error messages and spoken status updates.\n- Colour combinations chosen for readable contrast.\n- Text alternatives for images.\n\n## Known limitations\n\n[[List anything you know isn't fully accessible yet — for example, older PDFs or embedded slides.]]\n\n## Feedback\n\nIf something doesn't work for you, please let me know through the [contact form](#/contact) and I'll do my best to fix it.\n"}},"posts":[{"slug":"repurposing-oil-and-gas-infrastructure-for-cleaner-energy","title":"Repurposing oil and gas infrastructure for cleaner energy","date":"2026-10-18","updated":"","type":"Assignment","course":"[[Course code and name]]","categories":["energy-transition","energy-security","renewable-energy"],"tags":["geothermal","carbon capture","hydrogen","inactive wells","just transition","skills"],"excerpt":"Working notes for an essay: can wells, pipelines, reservoirs and skills from the oil and gas sector help build a cleaner energy system — and what are the risks of doing so?","featured":false,"draft":false,"commentsOpen":true,"readingMinutes":3,"body":"These are my working notes for an essay on repurposing oil and gas infrastructure. I'm sharing them early because I'd value challenge on the argument before I write the final version.\n\n## The basic idea\n\nDecades of oil and gas development have left behind a huge amount of physical infrastructure, geological knowledge and skilled people. Rather than treating all of it as a liability, could some of it be reused to support a cleaner energy system?\n\n## Options I'm looking at\n\n- **Geothermal energy.** Old wells and deep sedimentary formations can sometimes be used to access underground heat. Geothermal developers in southeast Saskatchewan have been exploring this kind of resource. [[Add source]]\n- **Carbon capture and storage.** Depleted reservoirs and existing pipelines may be suitable for transporting and storing CO₂. SaskPower's Boundary Dam carbon capture project is a frequently discussed — and debated — example. [[Add source]]\n- **Hydrogen.** Some pipelines may be able to carry hydrogen blends, though steel compatibility and safety need careful assessment.\n- **People and skills.** Drilling, subsurface engineering, project management and safety cultures transfer well to geothermal, storage and other clean energy work.\n- **Data and knowledge.** Seismic surveys and well records are valuable for understanding the subsurface for new uses.\n\n## The risks and open questions\n\n- **Technical integrity.** Old wells and pipelines weren't designed for these new uses. Testing and upgrades can be costly.\n- **Liability.** Who is responsible if a repurposed well leaks — the original operator, the new one, or the public?\n- **Lock-in.** Some uses, especially carbon capture tied to continued fossil fuel production, may extend reliance on fossil fuels rather than reduce it.\n- **Economics.** Repurposing only makes sense if it is cheaper or better than building new.\n- **Fairness.** Workers and communities in producing regions need a real stake in what comes next.\n\n## My working argument\n\n*Repurposing can be a valuable part of an energy transition when it reduces emissions and costs, transfers skills, and is backed by clear rules on liability — but it should be judged case by case, not used as a reason to delay change.*\n\n[[Refine your thesis statement here and add your marker's feedback when you receive it.]]\n\n## Key takeaways so far\n\n> - Existing infrastructure and skills can be assets for the transition, not only liabilities.\n> - Every repurposing option needs a clear-eyed look at integrity, liability and lock-in.\n> - The strongest case is where repurposing also delivers local jobs and benefits.\n\n*If you've worked on any of these technologies, I'd love to hear where my notes are wrong or incomplete.*\n","comments":[]},{"slug":"renewables-participation-ownership-and-energy-justice","title":"Renewable energy, participation, ownership and energy justice","date":"2026-10-12","updated":"","type":"Key takeaways","course":"[[Course code and name]]","categories":["energy-justice","renewable-energy","community-energy-planning"],"tags":["community energy","Indigenous-led energy","participation","ownership models","procedural justice"],"excerpt":"A wind farm can be clean and still feel unfair. Notes on why participation and ownership shape whether renewable energy projects deliver justice — and not just electricity.","featured":true,"draft":false,"commentsOpen":true,"readingMinutes":3,"body":"One idea from this week's readings has stuck with me: *a project can be renewable and still be unjust.* This post pulls together my notes on why participation and ownership matter so much.\n\n## Three ways of looking at energy justice\n\nThe readings this week used a framework with three tenets:\n\n- **Distributional justice** — how the benefits (jobs, revenue, cheaper power) and burdens (land use, noise, visual impact, cost) are shared.\n- **Procedural justice** — whether people affected by a decision have a fair and meaningful say in it.\n- **Recognition justice** — whether different groups, knowledges and rights are acknowledged and respected.\n\n[[Add citation — e.g. Jenkins et al. (2016)]]\n\n## Participation is not the same as consultation\n\nIt's easy to tick a box by holding an information session after the key decisions are already made. Real participation starts earlier and gives people genuine influence — over the site, the scale, the design and how benefits are shared. Arnstein's well-known \"ladder of participation\" was a useful reminder that informing people sits near the bottom of the ladder, not the top.\n\n## Ownership changes the conversation\n\nI found it helpful to compare ownership models:\n\n- **Utility-owned** — simpler to finance and coordinate, but benefits flow mainly through the utility.\n- **Private developer with a community benefit agreement** — local payments or funds, but limited local control.\n- **Co-operative or community-owned** — benefits and decisions stay local, but projects can be harder to finance.\n- **Indigenous-owned or equity partnerships** — Indigenous nations owning or co-owning projects, which can support self-determination, revenue and long-term capacity.\n\nThe pattern I noticed: the more ownership and decision-making sit with the community, the more likely the project is to be seen as fair — and the more likely it is to be accepted. Community energy has been described as being about both *process* (who it is by) and *outcome* (who it is for). [[Add citation — e.g. Walker & Devine-Wright (2008)]]\n\n## Questions I'm left with\n\n- How can smaller communities access the capital they need to own projects, not just host them?\n- What does meaningful participation look like when timelines are tight?\n- How should recognition of Indigenous rights and knowledge be built into planning from day one?\n\n## Key takeaways\n\n> - \"Clean\" and \"fair\" are separate tests. Good projects aim to pass both.\n> - Participation should shape decisions, not just inform people about them.\n> - Ownership is one of the strongest levers for distributing benefits and building trust.\n\n[[Add a local case study from your course here, with sources.]]\n","comments":[]},{"slug":"why-sdg-7-matters-to-local-communities","title":"The relevance of SDG 7 to local communities","date":"2026-10-05","updated":"","type":"Reflection","course":"[[Course code and name]]","categories":["sdg-7","sustainable-development","community-energy-planning"],"tags":["energy access","energy poverty","remote communities","efficiency"],"excerpt":"SDG 7 is often talked about as a global target for other places. Looking closer, its promise of affordable, reliable, sustainable and modern energy is surprisingly local.","featured":false,"draft":false,"commentsOpen":true,"readingMinutes":2,"body":"Sustainable Development Goal 7 aims to *\"ensure access to affordable, reliable, sustainable and modern energy for all.\"* When I first read it, I filed it mentally under international development — something about electrification in other parts of the world. This week's readings made me realise how local it is.\n\n## The targets, in plain language\n\n- **7.1** — Everyone has access to affordable, reliable, modern energy services.\n- **7.2** — A much larger share of energy comes from renewable sources.\n- **7.3** — The rate of improvement in energy efficiency doubles.\n- **7.a and 7.b** — Countries cooperate on research, investment and infrastructure, especially to support developing countries.\n\n## Why it matters close to home\n\nEven in wealthy countries, the four words *affordable, reliable, sustainable, modern* don't apply equally to everyone:\n\n- **Affordable** — some households spend a large share of their income on heating and power. Energy poverty is real in cold climates.\n- **Reliable** — rural and remote communities can face more frequent outages and longer restoration times.\n- **Sustainable** — many remote communities in Canada are not connected to the main grid and still rely on diesel generators.\n- **Modern** — older, poorly insulated homes lock people into high bills and discomfort.\n\nSeen this way, SDG 7 isn't something that's \"done\" once a country has an electricity grid. It's a lens for asking who is still being left behind.\n\n## What local action can look like\n\n- Home energy retrofits targeted at households with the highest energy burden.\n- Community-owned solar or wind projects that keep benefits local.\n- Microgrids and storage to reduce diesel dependence in remote communities.\n- Energy literacy programmes, so people can make informed choices.\n- Local energy plans that connect housing, transport and economic development.\n\n[[If relevant, add an example from your own community or home country here — local examples make this post much stronger.]]\n\n## Key takeaways\n\n> - SDG 7 is about everyone, everywhere — including communities in wealthy countries.\n> - The four qualities in the goal give a practical checklist for local energy planning.\n> - Local ownership and efficiency are two of the most direct ways to make progress.\n\n*Sources to add: UN SDG 7 targets and indicators [[add link]]; Tracking SDG 7 report [[add year]].*\n","comments":[]},{"slug":"energy-security-and-canadas-energy-transition","title":"Energy security and Canada's energy transition","date":"2026-09-28","updated":"","type":"Reflection","course":"[[Course code and name]]","categories":["energy-security","energy-transition"],"tags":["Canada","net zero","electricity grids","resilience","Saskatchewan"],"excerpt":"For a major energy producer like Canada, energy security isn't only about keeping supply flowing. It's also about economic resilience, reliable grids and a transition that regions and workers can trust.","featured":true,"draft":false,"commentsOpen":true,"readingMinutes":3,"body":"Most of the energy security writing I'd read before this programme came from the perspective of energy *importers*: countries worried about where their oil and gas would come from. Canada sits in a very different position, and that has made me rethink what energy security means.\n\n## A producer's view of security\n\nCanada is one of the world's major producers and exporters of energy, with large oil, natural gas, uranium and hydroelectric resources. For a country like this, energy security has several layers:\n\n- **Supply security at home** — keeping homes heated and the lights on, especially through long, cold winters.\n- **Economic security** — many communities, provincial budgets and jobs depend on energy production.\n- **Security for partners** — the conversation about supplying allies has grown louder since Russia's full-scale invasion of Ukraine in 2022.\n\nOne framing I found helpful from the readings defines energy security as the low vulnerability of vital energy systems. That shifts the question from \"do we have enough?\" to \"what could disrupt the systems we depend on, and how exposed are we?\" [[Add citation — e.g. Cherp & Jewell (2014)]]\n\n## Why the transition changes the picture\n\nCanada has committed in law to reaching net-zero emissions by 2050. Moving towards that goal changes where the vulnerabilities sit:\n\n- **Electricity becomes more central.** As heating and transport electrify, grid reliability becomes a bigger part of energy security.\n- **Provinces start from very different places.** Some generate most of their power from hydro; others, including Saskatchewan, have relied heavily on coal and natural gas. One national target means very different journeys.\n- **Extreme weather tests the system.** Cold snaps, heat waves and wildfires put pressure on both supply and infrastructure.\n- **New dependencies appear.** Critical minerals, supply chains for equipment and skilled workers become part of the security conversation.\n\n## What I'm taking from this\n\nI used to think of the transition and energy security as being in tension. I now think the more useful question is *how* a transition is managed. A rushed or poorly coordinated transition can create insecurity. A well-planned one — with stronger interties between provinces, storage, diverse supply and support for affected workers — can make the system more resilient than it is today.\n\n## Key takeaways\n\n> - Energy security for a producer country includes economic and regional security, not just supply.\n> - The transition shifts vulnerabilities rather than simply adding or removing them.\n> - Trust matters: regions and workers need to see a credible place for themselves in the future system.\n\n## Still thinking about\n\nHow should provinces with very different energy mixes share the costs and benefits of a national transition? [[Add your own reflection or a local example from your coursework.]]\n","comments":[]},{"slug":"understanding-the-energy-trilemma","title":"Understanding the energy trilemma","date":"2026-09-14","updated":"","type":"Course insight","course":"[[Course code and name]]","categories":["energy-trilemma","energy-security","energy-justice"],"tags":["World Energy Council","trade-offs","affordability","decarbonisation"],"excerpt":"Security, equity and environmental sustainability: why the energy trilemma is less a scorecard and more a set of questions worth asking about every energy decision.","featured":true,"draft":false,"commentsOpen":true,"readingMinutes":3,"body":"When I first saw the phrase \"energy trilemma\" on a lecture slide, I assumed it was one of those tidy frameworks that look good in a diagram and fall apart in the real world. A few weeks in, I've changed my mind — at least partly.\n\n## What the trilemma is\n\nThe World Energy Council describes energy systems as balancing three goals:\n\n- **Energy security** — whether supply is reliable, and whether the system can withstand and recover from shocks.\n- **Energy equity** — whether people and businesses can access energy and afford it.\n- **Environmental sustainability** — the environmental footprint of the system, especially greenhouse gas emissions.\n\nThe point isn't that these three goals always conflict. It's that decisions which strengthen one often put pressure on another, and good policy makes those trade-offs visible instead of pretending they don't exist.\n\n## A simple example that helped me\n\nTo make sense of it, I sketched out a simplified choice for a fictional province that needs new electricity supply:\n\n- **Extend an old coal plant.** It feels secure in the short term and is affordable today, but it performs badly on emissions and carries growing policy and carbon-price risk.\n- **Build a natural gas plant.** Flexible and lower-emitting than coal, but exposed to fuel price swings and likely to lock in infrastructure for decades.\n- **Invest in wind, storage and stronger connections to neighbouring grids.** Low emissions and no fuel costs, but reliability depends on careful planning, and the upfront costs land on someone.\n\nNone of these options \"wins\" on all three dimensions. What changed my thinking was realising that the trilemma works best as a set of questions: *secure for whom? affordable for whom? sustainable over what timeframe?*\n\n## Where I think the framework is limited\n\n- **It can flatten justice into affordability.** Equity in the trilemma is mainly about access and price. The energy justice literature asks broader questions about who takes part in decisions and whose knowledge is recognised.\n- **National scores hide local realities.** A country can perform well overall while some remote communities still depend on expensive, polluting diesel.\n- **It can look static.** Real systems change. Today's trade-off can become tomorrow's synergy as costs fall and technologies mature.\n\n## Key takeaways\n\n> - The trilemma makes trade-offs visible; it doesn't resolve them for you.\n> - Always ask *who* benefits from security, affordability and sustainability.\n> - Pairing the trilemma with energy justice thinking captures participation and recognition, not just price.\n\n## A question for readers\n\nHow should a jurisdiction weigh short-term affordability against long-term security when the costs of change fall unevenly? I'd genuinely like to hear how others think about this.\n\n*Sources to add: World Energy Council, World Energy Trilemma Index [[add year and link]]; course readings [[add]].*\n","comments":[{"name":"Sample Reader","affiliation":"Sample comment — delete before publishing","date":"2026-09-16","text":"This is an example of an approved comment. It shows how published comments look on your posts. Remove it in the content editor before you share the site."}]},{"slug":"first-weeks-in-the-programme","title":"First weeks in the programme: what I expected and what surprised me","date":"2026-09-07","updated":"","type":"Reflection","course":"[[Course code and name]]","categories":["sustainable-development","energy-security"],"tags":["learning journey","interdisciplinarity","reflection"],"excerpt":"I arrived expecting to learn mostly about technology. A few weeks in, the bigger lesson is that energy questions are really questions about people, institutions and trade-offs.","featured":false,"draft":false,"commentsOpen":true,"readingMinutes":2,"body":"I've been meaning to start this journal since orientation, and I'm finally sitting down to write. Part of the reason for keeping it public is accountability — if I write things down where others can see them, I'm more likely to keep going.\n\n## What I expected\n\nI came into the Master of Sustainability expecting energy security to be mostly about supply: pipelines, power plants, reserves and the occasional geopolitical crisis. I assumed I'd spend most of my time learning the technical side of renewables and how grids work.\n\n## What surprised me\n\nThe technical material is there, but what's struck me most so far is how *interdisciplinary* every conversation becomes. A discussion about a new transmission line turns out to be about land, treaty rights, consultation, prices, jobs and the climate — all at once. My classmates come from very different backgrounds, and I've already learned as much from their questions as from the readings.\n\nI've also had to get comfortable with uncertainty. Many of the questions we're asked don't have a single correct answer. They have better and worse arguments, and the work is in explaining the trade-offs clearly.\n\n## Things I'm going to try\n\n- Writing one short reflection a week, even if it's rough.\n- Keeping a reading log with a one-line summary of each source.\n- Asking \"secure for whom?\" whenever I read about energy security.\n- Being braver about sharing half-formed ideas — like this post.\n\n## Key takeaways\n\n> Energy questions are rarely only technical. The interesting part is usually in the trade-offs, and in who gets to decide.\n\n[[Replace or expand this post with your own first impressions of the programme.]]\n","comments":[]}],"projects":[{"slug":"case-study-geothermal-from-inactive-wells","title":"Case study: Geothermal heat from inactive wells","type":"Case study","date":"2027-01-20","status":"Planned","course":"[[Course code and name]]","collaborators":"","summary":"A case study on the opportunities and risks of using inactive oil and gas wells for geothermal heat. [[Placeholder — replace with your own case study.]]","body":"## Case background\n\n[[Describe the case, location and sources.]]\n\n## Analysis\n\n[[Apply a framework — e.g. the energy trilemma or energy justice tenets.]]\n\n## Lessons\n\n[[What could other regions learn from this case?]]\n","link":"","file":"","tags":["geothermal","repurposing","case study"],"categories":["energy-transition","renewable-energy"]},{"slug":"energy-security-indicators-literature-review","title":"Measuring energy security at the provincial level: a literature review","type":"Research paper","date":"2026-12-01","status":"In progress","course":"[[Course code and name]]","collaborators":"","summary":"A review of how energy security is defined and measured, and which indicators might work for a Canadian province. [[Placeholder — replace with your own project.]]","body":"## Research question\n\n[[What question does this paper answer?]]\n\n## Approach\n\n[[Describe your method — for example, a structured literature review of peer-reviewed articles and government reports.]]\n\n## Key findings so far\n\n- [[Finding 1]]\n- [[Finding 2]]\n\n## Files\n\n[[Upload your paper or abstract through the content editor and link it here.]]\n","link":"","file":"","tags":["indicators","energy security","literature review"],"categories":["energy-security"]},{"slug":"community-solar-feasibility-group-project","title":"Community solar feasibility study","type":"Group project","date":"2026-11-15","status":"Planned","course":"[[Course code and name]]","collaborators":"[[Team members — add names only with their permission]]","summary":"A group study exploring whether a community-owned solar project could work for a small municipality, including ownership options and community engagement. [[Placeholder — replace with your own project.]]","body":"## Project overview\n\n[[Describe the community, the question you're exploring and your role in the team.]]\n\n## What I contributed\n\n[[Your contribution — e.g. stakeholder mapping, financial model, engagement plan.]]\n\n## What I learned\n\n[[Two or three honest reflections on teamwork and the subject.]]\n","link":"","file":"","tags":["community energy","solar","feasibility"],"categories":["community-energy-planning","renewable-energy","energy-justice"]},{"slug":"campus-energy-awareness-initiative","title":"Campus energy awareness initiative","type":"Sustainability initiative","date":"2026-11-01","status":"Idea","course":"","collaborators":"","summary":"An idea for a student-led initiative to raise awareness of energy use on campus. [[Placeholder — replace with an initiative you're involved in, or delete.]]","body":"## The idea\n\n[[Describe the initiative, who's involved and what you hope to achieve.]]\n\n## How to get involved\n\n[[Add details or remove this section.]]\n","link":"","file":"","tags":["campus","energy efficiency","engagement"],"categories":["sustainable-development","sdg-7"]},{"slug":"presentation-energy-trilemma-in-practice","title":"Presentation: The energy trilemma in practice","type":"Presentation","date":"2026-10-30","status":"Draft","course":"[[Course code and name]]","collaborators":"","summary":"Slides and speaker notes applying the energy trilemma to real-world electricity decisions. [[Placeholder — replace with your own presentation.]]","body":"## About this presentation\n\n[[Where and when you presented, the audience and the main message.]]\n\n## Slides\n\n[[Upload your slides as a PDF through the content editor, then add the file below.]]\n","link":"","file":"","tags":["presentation","trilemma"],"categories":["energy-trilemma"]}],"resources":{"intro":"A growing, curated list of reports, readings, books, tools and links I return to often. Always check the latest edition before citing.","items":[{"type":"Reports","title":"World Energy Trilemma Index","author":"World Energy Council","year":"Annual","url":"https://www.worldenergy.org/transition-toolkit/world-energy-trilemma-index","note":"Country rankings across energy security, equity and environmental sustainability.","topics":["energy-trilemma"]},{"type":"Reports","title":"World Energy Outlook","author":"International Energy Agency","year":"Annual","url":"https://www.iea.org/topics/world-energy-outlook","note":"Widely cited global scenarios for energy supply, demand and emissions.","topics":["energy-security","energy-transition"]},{"type":"Reports","title":"Tracking SDG 7: The Energy Progress Report","author":"IEA, IRENA, UN DESA, World Bank and WHO","year":"Annual","url":"https://trackingsdg7.esmap.org/","note":"The official progress report on each SDG 7 target.","topics":["sdg-7"]},{"type":"Reports","title":"Canada's Energy Future","author":"Canada Energy Regulator","year":"Regular series","url":"https://www.cer-rec.gc.ca/en/data-analysis/canada-energy-future/","note":"Long-term energy supply and demand projections for Canada.","topics":["energy-transition","energy-security"]},{"type":"Reports","title":"Climate Change 2022: Mitigation of Climate Change (AR6 Working Group III)","author":"IPCC","year":"2022","url":"https://www.ipcc.ch/report/ar6/wg3/","note":"Includes detailed chapters on energy systems and mitigation pathways.","topics":["energy-transition","sustainable-development"]},{"type":"Articles","title":"The concept of energy security: Beyond the four As","author":"Cherp, A. & Jewell, J.","year":"2014","url":"https://doi.org/10.1016/j.enpol.2014.09.005","note":"Energy Policy. A helpful critique of common energy security definitions.","topics":["energy-security"]},{"type":"Articles","title":"Energy justice: A conceptual review","author":"Jenkins, K., McCauley, D., Heffron, R., Stephan, H. & Rehner, R.","year":"2016","url":"https://doi.org/10.1016/j.erss.2015.10.004","note":"Energy Research & Social Science. Sets out distributional, procedural and recognition justice.","topics":["energy-justice"]},{"type":"Articles","title":"Community renewable energy: What should it mean?","author":"Walker, G. & Devine-Wright, P.","year":"2008","url":"https://doi.org/10.1016/j.enpol.2007.10.019","note":"Energy Policy. A short, influential piece on process and outcome in community energy.","topics":["community-energy-planning","energy-justice"]},{"type":"Articles","title":"Energy justice: Conceptual insights and practical applications","author":"Sovacool, B. K. & Dworkin, M. H.","year":"2015","url":"https://doi.org/10.1016/j.apenergy.2015.01.002","note":"Applied Energy. Connects justice principles to practical energy decisions.","topics":["energy-justice"]},{"type":"Books","title":"Sustainable Energy — Without the Hot Air","author":"David J. C. MacKay","year":"2009","url":"https://www.withouthotair.com/","note":"A clear, numbers-first introduction to energy supply and demand. Free to read online.","topics":["renewable-energy"]},{"type":"Books","title":"Energy and Civilization: A History","author":"Vaclav Smil","year":"2017","url":"","note":"Long-view history of how energy has shaped societies.","topics":["energy-transition"]},{"type":"Books","title":"Global Energy Justice: Problems, Principles, and Practices","author":"Benjamin K. Sovacool & Michael H. Dworkin","year":"2014","url":"","note":"A comprehensive grounding in energy justice principles.","topics":["energy-justice"]},{"type":"Tools & data","title":"Our World in Data — Energy","author":"Our World in Data","year":"Ongoing","url":"https://ourworldindata.org/energy","note":"Interactive charts on energy production, consumption and emissions.","topics":["energy-transition","sdg-7"]},{"type":"Tools & data","title":"IEA Data and Statistics","author":"International Energy Agency","year":"Ongoing","url":"https://www.iea.org/data-and-statistics","note":"Global energy data, with some free datasets and charts.","topics":["energy-security"]},{"type":"Tools & data","title":"Zotero","author":"Open-source reference manager","year":"","url":"https://www.zotero.org/","note":"Free tool I use to collect, organise and cite readings.","topics":[]},{"type":"Links","title":"SDG 7 — Department of Economic and Social Affairs","author":"United Nations","year":"","url":"https://sdgs.un.org/goals/goal7","note":"Official targets, indicators and progress updates for SDG 7.","topics":["sdg-7","sustainable-development"]},{"type":"Links","title":"School of Environment and Sustainability","author":"University of Saskatchewan","year":"","url":"https://sens.usask.ca/","note":"Home of the Master of Sustainability programme.","topics":["sustainable-development"]},{"type":"Links","title":"Energy sources and distribution","author":"Natural Resources Canada","year":"","url":"https://natural-resources.canada.ca/energy-sources","note":"Federal information on Canada's energy sources and programmes.","topics":["energy-security","energy-transition"]}]}};</script>

  /* ------------------------------------------------------------ markdown (safe subset) */
  var ESCAPED = { '*': '&#42;', '_': '&#95;', '[': '&#91;', ']': '&#93;', '(': '&#40;', ')': '&#41;', '#': '&#35;', '`': '&#96;', '\\': '&#92;', '-': '&#45;', '+': '&#43;' };
  function inline(s) {
    // backslash-escaped characters written by the content editor
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!])/g, function (m, c) { return ESCAPED[c] || c; });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\[\[(.+?)\]\]/g, '<span class="placeholder"><span class="sr-only">Placeholder: </span>$1</span>');
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, url) {
      var u = safeUrl(url);
      return u && !/^mailto:/i.test(u) ? '<img src="' + esc(u) + '" alt="' + alt + '" loading="lazy">' : '';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
      var u = safeUrl(url);
      return u ? extLink(u, text) : text;
    });
    s = s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, function (m, url) { return extLink(url, url); });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');

  function blocks(lines) {

    function flush() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*$/.test(l)) { flush(); i++; continue; }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) {
        flush();
        var lvl = Math.max(2, m[1].length);
        out.push('<h' + lvl + ' id="sec-' + slugify(plain(m[2])) + '">' + inline(m[2]) + '</h' + lvl + '>');
        i++; continue;
      }
      if (/^(-{3,}|\*{3,})\s*$/.test(l)) { flush(); out.push('<hr>'); i++; continue; }
      if (/^&gt;\s?/.test(l)) {
        flush();
        var q = [];
        while (i < lines.length && /^&gt;\s?/.test(lines[i])) { q.push(lines[i].replace(/^&gt;\s?/, '')); i++; }

        continue;

      if (/^\s*[-*+]\s+/.test(l)) {
        flush();

        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++; }
        out.push('<ul>' + ul.join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(l)) {
        flush();
        var ol = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { ol.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++; }

      '</div></section>' +

      '<div class="section-head"><h2 id="topics-h" class="section-title">Explore by topic</h2><a class="more-link" href="#/topics">All topics <span aria-hidden="true">→</span></a></div>' +
      '<ul class="topic-grid compact">' + D.topics.map(topicTile).join('') + '</ul></div></section>' +

      '<span class="tt-name">' + esc(t.name) + '</span><span class="tt-count">' + n + (n === 1 ? ' post' : ' posts') + '</span></a></li>';

  function viewAbout() {
    var a = D.pages.about, s = settings();
    var html = pageHeader('About me', 'About me', ph(a.lead)) +
      '<div class="container about-grid">' +
      '<div class="prose">' + md(a.body) + '</div>' +

  function viewJournal(q) {
    var per = parseInt(settings().postsPerPage, 10) || 8;
    var types = TYPES_ORDER.filter(function (t) { return D.posts.some(function (p) { return p.type === t; }); });
    D.posts.forEach(function (p) { if (types.indexOf(p.type) < 0) types.push(p.type); });
    var list = D.posts.filter(function (p) {
      return (!q.type || p.type === q.type) && (!q.topic || p.categories.indexOf(q.topic) > -1);
    });
    if (q.sort === 'oldest') list = list.slice().reverse();
    var page = Math.max(1, parseInt(q.page, 10) || 1);
    var pages = Math.max(1, Math.ceil(list.length / per));
    if (page > pages) page = pages;
    var shown = list.slice((page - 1) * per, page * per);
    var filtered = !!(q.type || q.topic || q.sort);

    var html = pageHeader('Learning journal', 'Learning journal',
      'Reflections, lessons, assignments, course insights and key takeaways from the programme — written as I go.') +
      '<div class="container">' +
      '<form class="filter-bar" data-form="journal-filter" aria-label="Filter posts">' +
      '<div class="field inline"><label for="jf-type">Entry type</label><select id="jf-type" name="type"><option value="">All types</option>' +
      types.map(function (t) { return '<option' + (q.type === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field inline"><label for="jf-topic">Topic</label><select id="jf-topic" name="topic"><option value="">All topics</option>' +
      D.topics.map(function (t) { return '<option value="' + esc(t.slug) + '"' + (q.topic === t.slug ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field inline"><label for="jf-sort">Order</label><select id="jf-sort" name="sort"><option value="">Newest first</option><option value="oldest"' + (q.sort === 'oldest' ? ' selected' : '') + '>Oldest first</option></select></div>' +
      '<div class="filter-actions"><button class="btn btn-primary" type="submit">Apply filters</button>' + (filtered ? '<a class="btn btn-link" href="#/journal">Clear filters</a>' : '') + '</div>' +
      '</form>' +
      '<p class="result-count" role="status">' + (list.length ? 'Showing ' + shown.length + ' of ' + list.length + (list.length === 1 ? ' post' : ' posts') : 'No posts match these filters yet.') + '</p>' +
      '<div class="post-list">' + shown.map(function (p) { return postCard(p, 2); }).join('') + '</div>';
    if (pages > 1) {
      var base = { type: q.type || '', topic: q.topic || '', sort: q.sort || '' };
      html += '<nav class="pagination" aria-label="Journal pages">' +
        (page > 1 ? '<a class="btn btn-ghost" href="#/journal' + qs(Object.assign({}, base, { page: page - 1 })) + '">← Newer posts</a>' : '<span></span>') +
        '<span class="muted">Page ' + page + ' of ' + pages + '</span>' +
        (page < pages ? '<a class="btn btn-ghost" href="#/journal' + qs(Object.assign({}, base, { page: page + 1 })) + '">Older posts →</a>' : '<span></span>') +
        '</nav>';
    }
    html += '</div>';
    return { title: 'Learning journal', html: html };
  }

  function relatedPosts(p) {
    return D.posts.filter(function (o) { return o.slug !== p.slug; }).map(function (o) {
      var score = 0;
      o.categories.forEach(function (c) { if (p.categories.indexOf(c) > -1) score += 3; });
      o.tags.forEach(function (t) { if (p.tags.map(function (x) { return x.toLowerCase(); }).indexOf(t.toLowerCase()) > -1) score += 2; });
      return { p: o, score: score };
    }).sort(function (a, b) { return b.score - a.score || (a.p.date < b.p.date ? 1 : -1); }).slice(0, 3).map(function (x) { return x.p; });
  }

  function shareUrl(p) {
    var s = settings();
    if (hasText(s.siteUrl)) return String(s.siteUrl).replace(/\/+$/, '') + '/posts/' + p.slug + '/';
    if (!isBrowser) return '#/post/' + p.slug;
    return String(window.location.href).split('#')[0] + '#/post/' + p.slug;
  }

  function shareBlock(p) {
    var url = shareUrl(p), u = encodeURIComponent(url), t = encodeURIComponent(plain(p.title));
    var links = [
      ['LinkedIn', 'https://www.linkedin.com/sharing/share-offsite/?url=' + u],
      ['X', 'https://twitter.com/intent/tweet?url=' + u + '&text=' + t],
      ['Bluesky', 'https://bsky.app/intent/compose?text=' + t + '%20' + u],
      ['Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + u]
    ];
    return '<section class="share" aria-labelledby="share-h"><h2 id="share-h" class="h-small">Share this post</h2><ul class="share-list">' +
      links.map(function (l) {
        return '<li><a class="share-btn" href="' + esc(l[1]) + '" target="_blank" rel="noopener noreferrer">' + l[0] + '<span class="sr-only"> (share in a new tab)</span></a></li>';
      }).join('') +
      '<li><a class="share-btn" href="' + esc('mailto:?subject=' + t + '&body=' + encodeURIComponent(plain(p.title) + ' — ' + url)) + '">' + icon('mail') + 'Email</a></li>' +
      '<li><button type="button" class="share-btn" data-action="copy-link" data-url="' + esc(url) + '">' + icon('link') + 'Copy link</button></li>' +
      '</ul><p class="copy-status" role="status" aria-live="polite"></p></section>';
  }

  function commentList(p) {
    var items = (p.comments || []).concat(S.approved[p.slug] || []);
    if (!items.length) return '<p class="muted">No comments yet. Be the first to share a thought.</p>';
    return '<ol class="comment-list">' + items.map(function (c) {
      return '<li class="comment"><article aria-label="Comment by ' + esc(plain(c.name)) + '"><header class="comment-head">' +
        '<span class="avatar" aria-hidden="true">' + esc(plain(c.name).charAt(0).toUpperCase() || '?') + '</span>' +
        '<span><strong>' + ph(c.name) + '</strong>' + (c.affiliation ? '<span class="muted"> · ' + ph(c.affiliation) + '</span>' : '') +
        (c.date ? '<br><span class="muted small">' + timeTag(c.date) + '</span>' : '') + '</span></header>' +
        '<div class="comment-body">' + md(c.text) + '</div></article></li>';
    }).join('') + '</ol>';
  }

  function commentsSection(p) {
    var cfg = settings().comments || {};
    var provider = cfg.provider || 'moderated';
    var g = cfg.giscus || {};
    var count = (p.comments || []).length + (S.approved[p.slug] || []).length;
    var html = '<section class="comments" id="comments" aria-labelledby="comments-h"><div class="container narrow">' +
      '<h2 id="comments-h">Discussion' + (provider === 'moderated' ? ' <span class="count">(' + count + ')</span>' : '') + '</h2>';
    if (provider === 'off') return html + '<p class="muted">Comments are turned off on this site.</p></div></section>';
    if (provider === 'giscus' && !PREVIEW) {
      if (hasText(g.repo) && hasText(g.repoId) && hasText(g.categoryId)) {
        return html + '<p class="comment-note">Comments use GitHub sign-in, so every commenter is a verified account. Please read the <a href="#/guidelines">community guidelines</a> before posting.</p>' +
          '<div id="giscus-thread" class="giscus-wrap" data-slug="' + esc(p.slug) + '"></div></div></section>';
      }
      return html + '<p class="placeholder-box">' + ph('[[Comments are set to GitHub sign-in but are not configured yet. Add your Giscus details in Settings → Comments.]]') + '</p></div></section>';
    }
    html += commentList(p);
    var pending = S.pending.filter(function (c) { return c.slug === p.slug; });
    if (pending.length) {
      html += '<p class="pending-note">' + pending.length + (pending.length === 1 ? ' comment is' : ' comments are') + ' awaiting moderation.' +
        (PREVIEW ? ' <a href="#/moderation-demo">Open the moderation demo</a> to approve or remove ' + (pending.length === 1 ? 'it' : 'them') + '.' : '') + '</p>';
    }
    if (!p.commentsOpen) return html + '<p class="muted">Comments are closed on this post.</p></div></section>';
    html += '<div class="comment-form-wrap"><h3>Leave a comment</h3>' +
      '<p class="comment-note">Comments are reviewed before they appear, to keep the discussion constructive and spam-free. Your email address is used only to verify your comment and is never published. Please read the <a href="#/guidelines">community guidelines</a>.</p>' +
      formShell('comment', 'cm',

        field({ id: 'cm-name', name: 'name', label: 'Name', required: true, autocomplete: 'name', min: 2, max: 80 }) +
        field({ id: 'cm-email', name: 'email', label: 'Email (not published)', type: 'email', required: true, autocomplete: 'email' }) +
        '</div>' +
        field({ id: 'cm-aff', name: 'affiliation', label: 'Affiliation or role', hint: 'For example: "MSc student, University of Saskatchewan" or "Energy analyst".', max: 100, autocomplete: 'organization' }) +
        field({ id: 'cm-text', name: 'comment', label: 'Your comment', type: 'textarea', required: true, min: 10, max: 2000, rows: 6, counter: true, hint: 'Plain text. You can use **bold**, *italics* and links.' }) +
        field({ id: 'cm-agree', name: 'agree', label: 'I have read and agree to follow the <a href="#/guidelines">community guidelines</a>.', short: 'Community guidelines', type: 'checkbox', required: true }) +
        '<input type="hidden" name="post-slug" value="' + esc(p.slug) + '"><input type="hidden" name="post-title" value="' + esc(plain(p.title)) + '">' +
        '<button class="btn btn-primary" type="submit">Submit comment for review</button>',
        ' data-slug="' + esc(p.slug) + '"') +
      '</div></div></section>';
    return html;
  }

  function commentLabel(p) {
    var n = (p.comments || []).length + (S.approved[p.slug] || []).length;
    return n === 0 ? 'Join the discussion' : n === 1 ? '1 comment' : n + ' comments';

  function viewPost(slug) {
    var p = postBy(slug);
    if (!p) return viewNotFound();
    var idx = D.posts.indexOf(p);
    var newer = D.posts[idx - 1], older = D.posts[idx + 1];
    var s = settings();
    var rel = relatedPosts(p);
    var html = '<article class="post" aria-labelledby="post-title">' +
      '<header class="post-header"><div class="container narrow">' +
      '<nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="#/">Home</a></li><li><a href="#/journal">Learning journal</a></li><li aria-current="page">' + ph(p.title) + '</li></ol></nav>' +
      '<p class="eyebrow">' + esc(p.type) + (p.course ? ' · ' + ph(p.course) : '') + '</p>' +
      '<h1 id="post-title" tabindex="-1">' + ph(p.title) + '</h1>' +
      '<p class="post-meta">Published ' + timeTag(p.date) + (p.updated ? ' · Updated ' + timeTag(p.updated) : '') + ' · ' + p.readingMinutes + ' min read' +

      shareBlock(p) +
      '<div class="author-box">' + '<span class="avatar lg" aria-hidden="true">' + icon('leaf') + '</span><div><p class="h-small">Written by ' + ph(s.ownerName) + '</p>' +
      '<p>' + esc(s.programme || '') + ', ' + esc(s.university || '') + '. <a href="#/about">More about me</a> · <a href="#/contact">Get in touch</a></p></div></div>' +
      '<nav class="post-nav" aria-label="More posts">' +
      (older ? '<a class="pn-link" href="#/post/' + esc(older.slug) + '"><span class="muted small">← Previous post</span><span>' + ph(older.title) + '</span></a>' : '<span></span>') +
      (newer ? '<a class="pn-link next" href="#/post/' + esc(newer.slug) + '"><span class="muted small">Next post →</span><span>' + ph(newer.title) + '</span></a>' : '<span></span>') +
      '</nav></footer></div></article>' +
      (rel.length ? '<section class="section section-tint" aria-labelledby="rel-h"><div class="container"><h2 id="rel-h" class="section-title">Related posts</h2><div class="card-grid">' +
        rel.map(function (r) { return postCard(r, 3); }).join('') + '</div></div></section>' : '') +
      commentsSection(p);
    return { title: plain(p.title), html: html, post: p };

  function viewResearch(q) {

    D.projects.forEach(function (p) { if (types.indexOf(p.type) < 0) types.push(p.type); });
    var list = D.projects.filter(function (p) { return !q.type || p.type === q.type; });
    var html = pageHeader('Research & projects', 'Research and projects',
      'Research papers, presentations, case studies, group projects and sustainability initiatives from the programme.') +

      '<nav class="filter-tabs" aria-label="Filter by project type"><ul>' +

      '</ul></nav>' +

      '<div class="card-grid">' + list.map(function (p) { return projectCard(p, 2); }).join('') + '</div></div>';

      '<p class="eyebrow"><span class="badge">' + esc(p.type) + '</span>' + (p.status ? ' <span class="status">' + esc(p.status) + '</span>' : '') + '</p>' +
      '<h1 id="proj-title" tabindex="-1">' + ph(p.title) + '</h1>' +
      '<dl class="facts">' +
      (p.date ? '<div><dt>Date</dt><dd>' + timeTag(p.date) + '</dd></div>' : '') +
      (p.course ? '<div><dt>Course</dt><dd>' + ph(p.course) + '</dd></div>' : '') +
      (p.collaborators ? '<div><dt>Collaborators</dt><dd>' + ph(p.collaborators) + '</dd></div>' : '') +
      '</dl>' + topicChips(p.categories) + '</div></header>' +
      '<div class="container narrow"><p class="post-excerpt">' + ph(p.summary) + '</p><div class="prose">' + md(p.body) + '</div>' +
      (actions.length ? '<p class="btn-row">' + actions.join('') + '</p>' : '<p class="placeholder-box">' + ph('[[No file or link yet — add one in the content editor under Research & projects.]]') + '</p>') +
      (p.tags.length ? '<div class="tags-row"><h2 class="h-small">Tags</h2>' + tagList(p.tags) + '</div>' : '') +
      '<p><a href="#/research">← Back to all research and projects</a></p></div></article>';
    return { title: plain(p.title), html: html };

  function allTags() {
    var counts = {};
    D.posts.forEach(function (p) { p.tags.forEach(function (t) { var k = t.toLowerCase(); counts[k] = counts[k] || { name: t, n: 0 }; counts[k].n++; }); });
    return Object.keys(counts).map(function (k) { return counts[k]; }).sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name); });

  function viewTopics() {

      '</ul></section></div>';

  function viewTopic(slug) {

  function searchAll(q) {
    var terms = String(q || '').toLowerCase().split(/\s+/).map(function (t) { return t.replace(/[^\w\-'’]/g, ''); }).filter(function (t) { return t.length > 1; });
    if (!terms.length) return null;
    function score(fields) {
      var total = 0;
      for (var i = 0; i < terms.length; i++) {
        var hit = false;
        for (var j = 0; j < fields.length; j++) {
          if (String(fields[j][0] || '').toLowerCase().indexOf(terms[i]) > -1) { total += fields[j][1]; hit = true; }
        }
        if (!hit) return 0;
      }
      return total;
    }
    function rank(list, fn) {
      return list.map(function (x) { return { x: x, s: score(fn(x)) }; }).filter(function (r) { return r.s > 0; })
        .sort(function (a, b) { return b.s - a.s; }).map(function (r) { return r.x; });
    }
    return {
      terms: terms,
      posts: rank(D.posts, function (p) {
        return [[p.title, 6], [p.tags.join(' '), 4], [p.categories.map(function (c) { var t = topicBy(c); return t ? t.name : c; }).join(' '), 4], [p.excerpt, 3], [p.type, 2], [p.body, 1]];
      }),
      projects: rank(D.projects, function (p) { return [[p.title, 6], [p.tags.join(' '), 4], [p.summary, 3], [p.type, 2], [p.body, 1]]; }),
      resources: rank(D.resources.items || [], function (r) { return [[r.title, 6], [r.author, 3], [r.note, 2], [r.type, 2]]; })
    };
  }
