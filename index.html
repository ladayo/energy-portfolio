<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://giscus.app; frame-src https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; connect-src 'self'; form-action 'self' https://buttondown.com; base-uri 'self'; object-src 'none'">
<title>Energy Security Learning Portfolio</title>
<meta name="description" content="A learning journal on sustainability, energy security and fair energy transitions, written during a Master of Sustainability at the University of Saskatchewan.">
<meta name="theme-color" content="#14402f">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Learning journal feed" href="/feed.xml">
</head>
<body>
<!-- SHELL START -->
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main" tabindex="-1">
  <div class="container loading-state">
    <p>Loading…</p>
    <noscript><p>This site needs JavaScript turned on to show posts. You can still reach me through my professional profiles.</p></noscript>
  </div>
</main>
<div id="site-footer"></div>
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<!-- SHELL END -->

<!--
  Hidden copies of the site's forms. Netlify reads these when it builds the
  site so it knows which fields to accept. Do not delete them.
-->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="name"><input name="email"><input name="affiliation"><input name="subject">
  <textarea name="message"></textarea><input name="consent"><input name="bot-field">
</form>
<form name="comments" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="name"><input name="email"><input name="affiliation"><textarea name="comment"></textarea>
  <input name="post-slug"><input name="post-title"><input name="agree"><input name="bot-field">
</form>
<form name="subscribe" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="email"><input name="consent"><input name="bot-field">
</form>

<script src="/assets/js/app.js" defer></script>
</body>
</html>
